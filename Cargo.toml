[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/uniffi",
    "uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/uniffi-starter"

[workspace.dependencies]
# Keep this in lock-step with `uniffi-bindgen` below: the generator must match
# the runtime/scaffolding version, otherwise the generated bindings refuse to load.
uniffi = "0.32.2"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
